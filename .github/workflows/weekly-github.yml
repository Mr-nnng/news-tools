name: 每周 GitHub 周榜自动更新

on:
  # schedule:
  #   # UTC 05:00 每周六 = 北京时间 周六 13:00
  #   - cron: '0 5 * * 6'
  workflow_dispatch:
    # 支持手动触发，可指定日期（通过 inputs）

jobs:
  update-github-trending:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3

      - name: 安装依赖
        run: uv sync

      - name: 运行每周更新脚本
        id: update
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_DEFAULT_MODEL: ${{ secrets.OPENAI_DEFAULT_MODEL }}
        run: |
          DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d')
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          echo "🚀 开始更新 $DATE GitHub 周榜..."
          uv run python scripts/weekly_update.py --date "$DATE" 2>&1

      - name: 检查是否生成了新数据
        id: check
        run: |
          DATE="${{ steps.update.outputs.date }}"
          if [ -f "site/data/github/$DATE.json" ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            echo "✅ 新数据已生成: site/data/github/$DATE.json"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  $DATE 暂无新数据，但可能已有变更需要提交"
          fi

      - name: 提交并推送变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add site/

          if git diff --quiet && git diff --staged --quiet; then
            echo "ℹ️  没有新的变更需要提交"
          else
            DATE="${{ steps.update.outputs.date }}"
            git commit -m "chore(github): auto-update 周榜 $DATE"
            git push
            echo "✅ 已提交并推送周榜更新"
          fi
