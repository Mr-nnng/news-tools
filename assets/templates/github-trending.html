<!DOCTYPE html>
<!-- ==================================================================
     GITHUB TRENDING WEEKLY · 连续滚动风格 (与 XWLB 一致)
     Kami design system: warm parchment, ink-blue accent, serif-led
     Font paths: ../../assets/fonts/ (when deployed to site/github_weekly/{date}/)
     ================================================================== -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GitHub Trending 周报 · {{WEEK_LABEL}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="GitHub Trending 中文周报，{{WEEK_LABEL}}，共 {{REPO_COUNT}} 个项目。">
<meta property="og:title" content="GitHub Trending 周报 · {{WEEK_LABEL}}">
<meta property="og:description" content="GitHub Trending 中文周报，{{WEEK_LABEL}}。">
<meta property="og:type" content="article">
<meta property="og:url" content="https://news-tools.pages.dev">
<link rel="canonical" href="https://news-tools.pages.dev">
<style>
/* ========== Tokens ========== */

@font-face {
  font-family: "JetBrains Mono";
  src: url("../../../assets/fonts/JetBrainsMono.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: "TsangerJinKai02";
  src: url("../../../assets/fonts/TsangerJinKai02_W04.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

:root {
  --parchment:    #f5f4ed;
  --ivory:        #faf9f5;
  --warm-sand:    #e8e6dc;

  --brand:        #1B365D;
  --brand-light:  #2D5A8A;
  --brand-tint:   #EEF2F7;

  --near-black:   #141413;
  --dark-warm:    #3d3d3a;
  --olive:        #504e49;
  --stone:        #6b6a64;

  --border:       #e8e6dc;
  --border-soft:  #e5e3d8;
  --line:         #d8d5c8;

  --serif: "TsangerJinKai02", "PingFang SC", "PingFang TC", "Microsoft YaHei",
           system-ui, -apple-system, sans-serif;
  --sans:  var(--serif);
  --mono:  "JetBrains Mono", "SF Mono", "Fira Code", Consolas, Monaco, monospace;
  --latin-ui: var(--sans);

  --sidebar-w: 200px;
  --index-w: 260px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  background: var(--parchment);
  color: var(--near-black);
  font-family: var(--serif);
  font-size: 15px;
  line-height: 1.58;
  letter-spacing: 0.4px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding-left: var(--sidebar-w);
  padding-right: var(--index-w);
}

a {
  color: var(--brand);
  text-decoration: none;
  transition: color 0.15s;
}
a:hover { color: var(--brand-light); }

/* ========== Sidebar (same as XWLB) ========== */

.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: var(--sidebar-w);
  background: var(--parchment);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 100;
  overflow-y: auto;
  padding: 20px 0 16px;
}
.sidebar::-webkit-scrollbar {
  width: 4px;
}
.sidebar::-webkit-scrollbar-thumb {
  background: var(--line);
  border-radius: 2px;
}

.sidebar-home {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px 18px;
  margin: 0 0 6px;
  color: var(--near-black);
  text-decoration: none;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 18px;
  border-bottom: 1px solid var(--border-soft);
}
.sidebar-home:hover { color: var(--brand); }
.sidebar-home .icon { font-size: 20px; }

.sidebar-section {
  padding: 0 16px;
  margin-top: 8px;
}
.sidebar-section:last-child { margin-bottom: 0; }

.sidebar-month-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
  padding: 8px 0;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 15px;
  color: var(--brand);
  letter-spacing: 0.3px;
}
.sidebar-month-toggle:hover { color: var(--brand-light); }
.sidebar-month-toggle .arrow {
  font-size: 13px;
  color: var(--stone);
  transition: transform 0.25s ease;
}
.sidebar-month-group.is-collapsed .sidebar-month-toggle .arrow {
  transform: rotate(-90deg);
}

.sidebar-month-items {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: max-height 0.3s ease, opacity 0.2s ease;
  max-height: 600px;
  opacity: 1;
}
.sidebar-month-group.is-collapsed .sidebar-month-items {
  max-height: 0 !important;
  opacity: 0;
  pointer-events: none;
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 0 7px 18px;
  color: var(--olive);
  text-decoration: none;
  font-family: var(--serif);
  font-size: 14px;
  border-radius: 4px;
  position: relative;
  transition: color 0.15s, background 0.15s;
}
.sidebar-item:hover { color: var(--brand); background: var(--brand-tint); }
.sidebar-item::before {
  content: "";
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--line);
}
.sidebar-item.is-active { color: var(--brand); font-weight: 500; }
.sidebar-item.is-active::before { background: var(--brand); width: 9px; height: 9px; }

.sidebar-footer {
  margin-top: auto;
  padding: 16px 16px 0;
  border-top: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sidebar-footer a {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  color: var(--stone);
  text-decoration: none;
  font-family: var(--serif);
  font-size: 13px;
}
.sidebar-footer a:hover { color: var(--brand); }
.sidebar-footer .icon { font-size: 16px; width: 20px; text-align: center; }

/* ========== Layout ========== */

.page {
  max-width: 820px;
  margin: 0 auto;
  padding: 56px 64px 80px;
}

/* ========== Header ========== */

.page-header {
  margin-bottom: 40px;
  padding-bottom: 28px;
  border-bottom: 1px solid var(--border-soft);
}

.page-header .eyebrow {
  font-family: var(--latin-ui);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.4px;
  color: var(--stone);
  margin: 0 0 16px;
}

.page-header .eyebrow a { color: var(--brand); }

.page-header h1 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 38px;
  line-height: 1.15;
  letter-spacing: 0.6px;
  color: var(--near-black);
  margin: 0 0 12px;
}

.page-header .meta {
  font-family: var(--latin-ui);
  font-size: 14px;
  color: var(--stone);
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
}

.page-header .meta .tag {
  display: inline-block;
  background: var(--brand);
  color: var(--ivory);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.5px;
  padding: 2px 10px;
  border-radius: 999px;
}

/* ========== Cover: summary ========== */

.cover-summary {
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.65;
  color: var(--olive);
  margin: 0 0 28px;
  padding: 16px 20px;
  background: var(--ivory);
  border-left: 3px solid var(--brand);
  border-radius: 3px;
}

.cover-summary .hl {
  color: var(--brand);
  font-weight: 500;
}

.cover-summary strong {
  color: var(--near-black);
  font-weight: 500;
}

/* ========== Cover: rank table ========== */

.section-head {
  margin-bottom: 20px;
}

.section-num {
  font-family: var(--latin-ui);
  font-weight: 400;
  font-size: 14px;
  color: var(--brand);
  letter-spacing: 0.4px;
  margin: 0 0 4px;
}

.section-title {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 26px;
  line-height: 1.25;
  color: var(--near-black);
  margin: 0;
  letter-spacing: 0.6px;
}

.rank-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  text-align: left;
  margin-bottom: 48px;
}

.rank-table thead th {
  font-weight: 500;
  color: var(--brand);
  padding: 6px 10px;
  border-bottom: 1.5px solid var(--brand);
  letter-spacing: 0.4px;
  font-size: 14px;
}

.rank-table tbody td {
  padding: 5px 10px;
  border-bottom: 0.5px solid var(--border-soft);
  color: var(--dark-warm);
  line-height: 1.45;
}

.rank-table tbody tr:last-child td {
  border-bottom: none;
}

.rank-table .td-rank {
  color: var(--stone);
  font-family: var(--mono);
  font-size: 16px;
  width: 30px;
  text-align: center;
}

.rank-table .td-repo {
  font-weight: 500;
  color: var(--near-black);
  font-size: 16px;
}

.rank-table .td-repo .author {
  font-weight: 400;
  color: var(--stone);
  font-size: 13px;
}

.rank-table .td-stars,
.rank-table .td-forks {
  font-family: var(--mono);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.rank-table .td-stars {
  color: var(--brand);
  font-weight: 500;
}

.rank-table .td-forks {
  color: var(--stone);
}

/* ========== Repo items (continuous scroll) ========== */

.repo-section { margin-top: 24px; }

.repo-item {
  margin-bottom: 40px;
  padding-bottom: 36px;
  border-bottom: 2px solid var(--line);
  position: relative;
}

.repo-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

/* Decorative big number */
.repo-item .repo-number {
  font-family: var(--serif);
  font-size: 72px;
  font-weight: 500;
  color: var(--brand);
  line-height: 1;
  opacity: 0.06;
  position: absolute;
  top: -6px;
  right: 0;
  pointer-events: none;
  user-select: none;
}

.repo-item .repo-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  padding-right: 64px;
}

.repo-item .repo-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  flex-shrink: 0;
  overflow: hidden;
  border: 1px solid var(--border);
}

.repo-item .repo-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.repo-item .repo-name {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 21px;
  line-height: 1.3;
  color: var(--near-black);
  word-break: break-all;
}

.repo-item .repo-name .author-name {
  font-weight: 400;
  font-size: 13px;
  color: var(--stone);
  display: block;
  margin-top: 1px;
}

.repo-item .repo-name a { color: inherit; }
.repo-item .repo-name a:hover { color: var(--brand); }

.repo-item .repo-metrics {
  display: flex;
  gap: 14px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.repo-item .repo-metric {
  display: flex;
  align-items: baseline;
  gap: 3px;
  font-size: 13px;
}

.repo-item .repo-metric .val {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 500;
  color: var(--brand);
  font-variant-numeric: tabular-nums;
}

.repo-item .repo-metric .lbl {
  font-size: 11px;
  color: var(--stone);
  letter-spacing: 0.3px;
}

.repo-item .repo-metric .lang-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 2px;
  vertical-align: middle;
}

.repo-item .repo-desc {
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.6;
  color: var(--olive);
  margin-bottom: 10px;
  padding: 10px 16px;
  background: var(--ivory);
  border-left: 3px solid var(--brand);
  border-radius: 3px;
}

.repo-item .repo-features {
  list-style: none;
  padding: 0;
  margin: 0 0 10px;
}

.repo-item .repo-features li {
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.45;
  color: var(--dark-warm);
  padding: 2px 0 2px 18px;
  position: relative;
}

.repo-item .repo-features li::before {
  content: "\25C6";
  position: absolute;
  left: 0;
  color: var(--brand);
  font-size: 7px;
  top: 6px;
}

.repo-item .repo-audience {
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  color: var(--stone);
  padding: 6px 12px;
  background: var(--brand-tint);
  border-radius: 4px;
  margin-bottom: 10px;
  display: inline-block;
}

.repo-item .repo-audience strong {
  color: var(--brand);
  font-weight: 500;
}

.repo-item .repo-url {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--stone);
  word-break: break-all;
  padding-top: 6px;
  margin-top: 8px;
  border-top: 1px solid var(--border);
  letter-spacing: 0.2px;
  line-height: 1.4;
}

.repo-item .repo-url a {
  color: var(--brand);
  text-decoration: none;
}

/* ========== Right index nav ========== */

.index-nav {
  position: fixed;
  right: 0;
  top: 0;
  bottom: 0;
  width: var(--index-w);
  background: var(--parchment);
  border-left: 1px solid var(--border);
  z-index: 99;
  overflow-y: auto;
  padding: 28px 0 20px;
  display: flex;
  flex-direction: column;
}
.index-nav::-webkit-scrollbar { width: 4px; }
.index-nav::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

.index-nav .index-head {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 18px;
  letter-spacing: 0;
  color: var(--near-black);
  padding: 0 16px 14px;
  margin: 0 0 6px;
  border-bottom: 1px solid var(--border-soft);
}

.index-nav .index-item {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 6px 16px;
  font-family: var(--serif);
  font-size: 14px;
  line-height: 1.5;
  color: var(--olive);
  text-decoration: none;
  transition: color 0.15s, background 0.15s;
  border-right: 2px solid transparent;
}

.index-nav .index-item:hover {
  color: var(--brand);
  background: var(--brand-tint);
}

.index-nav .index-item.is-active {
  color: var(--brand);
  font-weight: 500;
  background: var(--brand-tint);
  border-right-color: var(--brand);
}

.index-nav .index-item .idx-num {
  font-family: var(--latin-ui);
  font-size: 11px;
  font-weight: 500;
  color: var(--stone);
  min-width: 22px;
  text-align: right;
  flex-shrink: 0;
}

.index-nav .index-item.is-active .idx-num {
  color: var(--brand);
}

/* ========== Footer ========== */

footer.foot {
  margin-top: 64px;
  padding-top: 36px;
  border-top: 1px solid var(--border-soft);
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 48px;
  font-size: 13px;
  color: var(--stone);
}

.foot .mark { display: grid; grid-template-columns: auto; gap: 2px; }

.foot .mark .wm-name {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 28px;
  color: var(--near-black);
  line-height: 1.1;
  letter-spacing: 0;
}

.foot .mark .wm-line { font-size: 13px; color: var(--olive); margin-top: 2px; }

.foot .colophon { text-align: right; max-width: 420px; }

.foot .colophon .links {
  font-family: var(--latin-ui);
  color: var(--dark-warm);
  margin-bottom: 16px;
  line-height: 1.55;
}

.foot .colophon .links a { color: var(--dark-warm); }
.foot .colophon .links a:hover { color: var(--brand); }
.foot .colophon .ethos { color: var(--olive); line-height: 1.55; max-width: 320px; margin-left: auto; }

/* ========== Responsive ========== */

@media (max-width: 1200px) {
  .index-nav { display: none; }
  body { padding-right: 0; }
}

@media (max-width: 880px) {
  .page { padding: 40px 28px 60px; }
  .page-header h1 { font-size: 34px; letter-spacing: 0.4px; }
  .page-header { margin-bottom: 32px; padding-bottom: 24px; }
  .section-title { font-size: 22px; }
  .repo-item .repo-name { font-size: 18px; }
}

@media (max-width: 800px) {
  .sidebar {
    position: relative;
    width: 100%;
    flex-direction: row;
    flex-wrap: wrap;
    padding: 12px 16px;
    border-right: none;
    border-bottom: 1px solid var(--border);
    overflow-y: visible;
    gap: 8px;
  }
  .sidebar-home { border-bottom: none; padding: 0; margin: 0; }
  .sidebar-section { display: none; }
  .sidebar-footer { margin-top: 0; border-top: none; padding: 0; flex-direction: row; }
  body { padding: 0; }
  .page { padding: 32px 20px 48px; }
  .page-header h1 { font-size: 28px; }
  .page-header .meta { flex-direction: column; gap: 8px; align-items: flex-start; }
  .repo-item { margin-bottom: 28px; padding-bottom: 24px; }
  .repo-item .repo-desc { padding: 8px 12px; font-size: 14px; }
  .rank-table { font-size: 13px; }
}

@media (max-width: 480px) {
  .page { padding: 24px 16px 40px; }
  .page-header { margin-bottom: 20px; padding-bottom: 16px; }
  .page-header h1 { font-size: 22px; letter-spacing: 0.2px; }
  .page-header .meta { font-size: 12px; gap: 6px; }
  .section-title { font-size: 18px; }
  .cover-summary { font-size: 14px; padding: 12px 14px; }
  .repo-item .repo-name { font-size: 16px; }
  .repo-item .repo-name .author-name { font-size: 12px; }
  .repo-item .repo-header { gap: 8px; }
  .repo-item .repo-avatar { width: 32px; height: 32px; }
  .repo-item .repo-metrics { gap: 10px; }
  .repo-item .repo-metric { font-size: 12px; }
  .repo-item .repo-metric .val { font-size: 13px; }
  .repo-item .repo-desc { font-size: 14px; padding: 8px 12px; }
  .repo-item .repo-features li { font-size: 13px; }
  .repo-item .repo-audience { font-size: 12px; }
  .repo-item .repo-url { font-size: 11px; }
  .repo-item .repo-number { font-size: 48px; }
  .rank-table { font-size: 12px; }
  .rank-table thead th { font-size: 11px; padding: 4px 6px; }
  .rank-table tbody td { padding: 3px 6px; }
  .rank-table .td-repo { font-size: 13px; }
  .rank-table .td-repo .author { font-size: 10px; }
  footer.foot { margin-top: 40px; padding-top: 24px; flex-direction: column; gap: 24px; }
  footer.foot .colophon { text-align: left; max-width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  .page-header h1 { animation: none; opacity: 1; transform: none; filter: none; }
}
</style>
</head>
<body>

{{SIDEBAR}}
<nav class="index-nav">
  <div class="index-head">本页导航</div>
  {{REPO_INDEX}}
</nav>

<main class="page">

  <!-- ============ Header ============ -->
  <header class="page-header">
    <div class="eyebrow">
      <a href="../../index.html">← 返回主页</a>
      <span style="margin-left:12px;color:var(--stone)">News Tools</span>
    </div>

    <h1>GitHub Trending <span style="color:var(--brand)">周报</span></h1>

    <div class="meta">
      <span><span class="tag">GitHub Trending</span></span>
      <span>{{REPO_COUNT}} 个项目</span>
      <span>{{WEEK_INFO}}</span>
    </div>
  </header>

  <!-- ============ Cover Summary ============ -->
  <div class="cover-summary">
    {{COVER_SUMMARY}}
  </div>

  <!-- ============ Top 10 Rank Table ============ -->
  <section id="gh-cover">
    <div class="section-head">
      <p class="section-num">排行榜</p>
      <h2 class="section-title">本周热门项目 Top 10</h2>
    </div>
    <table class="rank-table">
      <thead>
        <tr>
          <th style="width:30px;text-align:center">#</th>
          <th>仓库</th>
          <th style="width:48px">语言</th>
          <th style="width:64px;text-align:right">Star</th>
          <th style="width:64px;text-align:right">Fork</th>
        </tr>
      </thead>
      <tbody>
        {{RANK_TABLE_ROWS}}
      </tbody>
    </table>
  </section>

  <!-- ============ Repo Detail Items ============ -->
  <section class="repo-section">
    <div class="section-head">
      <p class="section-num">详细内容</p>
      <h2 class="section-title">逐个项目介绍</h2>
    </div>

    {{REPO_ITEMS}}
  </section>

  <!-- ============ Footer ============ -->
  <footer class="foot">
    <div class="mark">
      <span class="wm-name">News Tools</span>
      <span class="wm-line">GitHub Trending 中文周报</span>
    </div>
    <div class="colophon">
      <div class="links">
        <a href="https://github.com/Mr-nnng/news-tools" target="_blank" rel="noopener">GitHub</a> ·
        <a href="https://github.com/Mr-nnng/news-tools/blob/main/LICENSE" target="_blank" rel="noopener">MIT License</a>
      </div>
      <p class="ethos">每周为你发现开源世界的好项目</p>
    </div>
  </footer>

</main>

<script>
(function() {
    // Sidebar collapse
    var toggles = document.querySelectorAll('.sidebar-month-toggle');
    toggles.forEach(function(t) {
        t.addEventListener('click', function() {
            this.parentElement.classList.toggle('is-collapsed');
        });
    });

    // Active index tracking
    var indexItems = document.querySelectorAll('.index-nav .index-item');
    if (!indexItems.length) return;

    var sections = [];
    indexItems.forEach(function(item) {
        var href = item.getAttribute('href');
        if (href && href.startsWith('#')) {
            var el = document.querySelector(href);
            if (el) sections.push({ el: el, link: item });
        }
    });
    if (!sections.length) return;

    function updateActive() {
        var scrollY = window.scrollY;
        var bestIdx = -1;
        var bestDist = Infinity;
        for (var i = 0; i < sections.length; i++) {
            var rect = sections[i].el.getBoundingClientRect();
            var dist = Math.abs(rect.top - 100);
            if (dist < bestDist) {
                bestDist = dist;
                bestIdx = i;
            }
        }
        if (bestIdx >= 0) {
            var activeId = '#' + sections[bestIdx].el.getAttribute('id');
            indexItems.forEach(function(item) {
                item.classList.toggle('is-active', item.getAttribute('href') === activeId);
            });
        }
    }

    var ticking = false;
    window.addEventListener('scroll', function() {
        if (!ticking) {
            window.requestAnimationFrame(function() {
                updateActive();
                ticking = false;
            });
            ticking = true;
        }
    });
    updateActive();
})();
</script>
</body>
</html>
