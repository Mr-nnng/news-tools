name: Schedule Debug

on:
  schedule:
    # 每 3 分钟触发一次，用于验证 schedule 事件是否被 GitHub 调度器发送到仓库
    - cron: '*/20 * * * *'
  workflow_dispatch:
    # 支持手动触发

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: 打印触发信息
        run: |
          echo "UTC_TIME: $(date -u)"
          echo "TRIGGERED_BY=$GITHUB_EVENT_NAME"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"

      - name: 写入日志文件
        run: |
          echo "$(date -u) $GITHUB_EVENT_NAME $GITHUB_RUN_ID $GITHUB_RUN_NUMBER" >> debug-schedule.log

      - name: 上传日志作为 artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-schedule-log
          path: debug-schedule.log